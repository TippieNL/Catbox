<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your images · Catbox-style Host</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">C</div>
      <span>Catbox-style Host</span>
    </div>
    <nav>
      <a href="/">Upload</a>
      <a href="/temporary">Temporary</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/images">Images</a>
      <a href="/faq">FAQ</a>
      <a href="/tools">Tools</a>
      <a href="/contact">Contact</a>
      <a href="/legal">Legal</a>
      <a href="/api-docs">API Docs</a>
      <button id="theme-toggle" class="action" type="button">🌙 Dark</button>
    </nav>
  </header>
  <main class="grid">
    <section class="hero">
      <h1>Your uploaded images</h1>
      <p>Preview image uploads and copy their direct links.</p>
    </section>

    <section class="card">
      <div class="input-row" style="justify-content: space-between; align-items:center;">
        <h3 style="margin:0;">Image gallery</h3>
        <div class="small">Log in to see your images.</div>
      </div>
      <div id="image-grid" class="image-grid">
        <div class="card">Loading…</div>
      </div>
    </section>
  </main>
  <footer>Images page shows your uploaded media with direct links.</footer>
  <script src="/app.js"></script>
</body>
</html>
